[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signaling"
version = "1.0.0"
description = "Job-market signaling and common-pool resource experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.5"]

[project.optional-dependencies]
visualization = ["matplotlib==3.11.2", "Pillow==13.0.0", "scipy==1.18.0"]
analysis = ["scikit-learn==1.9.1", "scipy==1.18.0", "onnxruntime==1.32.0", "tokenizers==0.23.3", "threadpoolctl==3.8.0"]
llm = [
    "python-dotenv>=1.2.4",
]
cpr-analysis = [
    "pandas==3.1.1",
    "statsmodels==0.15.0",
]
cpr-semantic = [
    "sentence-transformers==6.3.0",
]

[project.scripts]
signaling = "signaling.cli:main"
cpr = "common_pool_resource.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
